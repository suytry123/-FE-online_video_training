<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow border-0">
        <div class="card-body text-center p-5">
          <!-- Loading -->
          <div *ngIf="loading">
            <div class="spinner-border text-primary mb-3" role="status"></div>

            <h4>Verifying your email...</h4>
          </div>

          <!-- Success -->
          <div *ngIf="!loading && successMessage">
            <div class="mb-3">
              <i
                class="bi bi-check-circle-fill text-success"
                style="font-size: 4rem"
              >
              </i>
            </div>

            <h3 class="text-success">Email Verified</h3>

            <p class="mt-3">
              {{ successMessage }}
            </p>

            <a routerLink="/login" class="btn btn-success mt-3">
              Go to Login
            </a>
          </div>

          <!-- Error -->
          <div *ngIf="!loading && errorMessage">
            <div class="mb-3">
              <i
                class="bi bi-x-circle-fill text-danger"
                style="font-size: 4rem"
              >
              </i>
            </div>

            <h3 class="text-danger">Verification Failed</h3>

            <p class="mt-3">
              {{ errorMessage }}
            </p>

            <a routerLink="/" class="btn btn-secondary mt-3"> Back to Home </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
