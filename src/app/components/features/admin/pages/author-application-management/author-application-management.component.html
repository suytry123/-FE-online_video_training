<div class="card shadow">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Author Applications</h4>
  </div>

  <div class="card-body">
    <!-- Filters -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          placeholder="Search by username"
          [(ngModel)]="username"
        />
      </div>

      <div class="col-md-3">
        <select
          class="form-select"
          [(ngModel)]="status"
          (change)="loadApplications(true)"
        >
          <option value="">All Status</option>
          <option value="PENDING">Pending</option>
          <option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected</option>
        </select>
      </div>

      <div class="col-md-2">
        <button
          type="button"
          class="btn btn-primary w-100"
          (click)="loadApplications(true)"
        >
          Search
        </button>
      </div>

      <div class="col-md-2">
        <button
          type="button"
          class="btn btn-secondary w-100"
          (click)="resetFilters()"
        >
          Reset
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div class="text-center my-4" *ngIf="loading">
      <div class="spinner-border text-primary"></div>
    </div>

    <!-- Table -->
    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Username</th>
            <th>Education</th>
            <th>Address</th>
            <th>Bio</th>
            <th>Expertise</th>
            <th>Status</th>
            <th width="180">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let app of applications; trackBy: trackByApplicationId">
            <td>
              <strong>{{ app.username }}</strong>
            </td>

            <td>{{ app.education }}</td>

            <td>{{ app.address }}</td>

            <td>
              <div class="text-ellipsis" [title]="app.authorBio">
                {{ app.authorBio }}
              </div>
            </td>

            <td>
              <div class="text-ellipsis" [title]="app.authorExpertise">
                {{ app.authorExpertise }}
              </div>
            </td>

            <td>
              <span
                *ngIf="app.status === 'PENDING'"
                class="badge bg-warning text-dark"
              >
                Pending
              </span>

              <span *ngIf="app.status === 'APPROVED'" class="badge bg-success">
                Approved
              </span>

              <span *ngIf="app.status === 'REJECTED'" class="badge bg-danger">
                Rejected
              </span>
            </td>

            <td>
              <button
                type="button"
                class="btn btn-success btn-sm me-2"
                (click)="approve(app.applicationId)"
                [disabled]="app.status !== 'PENDING' || processing"
              >
                Approve
              </button>

              <button
                type="button"
                class="btn btn-danger btn-sm"
                (click)="reject(app.applicationId)"
                [disabled]="app.status !== 'PENDING' || processing"
              >
                Reject
              </button>
            </td>
          </tr>

          <tr *ngIf="applications.length === 0">
            <td colspan="7" class="text-center text-muted">
              No applications found
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div
      class="d-flex justify-content-between align-items-center mt-3"
      *ngIf="!loading && totalPages > 0"
    >
      <button
        type="button"
        class="btn btn-outline-primary"
        [disabled]="pageNumber === 0"
        (click)="previousPage()"
      >
        Previous
      </button>

      <span> Page {{ pageNumber + 1 }} of {{ totalPages }} </span>

      <button
        type="button"
        class="btn btn-outline-primary"
        [disabled]="pageNumber + 1 >= totalPages"
        (click)="nextPage()"
      >
        Next
      </button>
    </div>
  </div>
</div>
