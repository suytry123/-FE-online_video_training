<div class="container mt-4">

  <div class="row">

    <div
      class="col-md-4 mb-4"
      *ngFor="let course of courses">

      <div class="card h-100 shadow-sm">

        <!-- image_cover -->
        <img
          *ngIf="course.image_cover"
          [src]="'http://localhost:8080/api/courses/image/' + course.id"
          class="card-img-top"
          height="220"
          style="object-fit: cover;"
        />

        <div class="card-body d-flex flex-column">

          <h5 class="fw-bold">

            {{ course.name }}

          </h5>

          <p class="text-muted">

            Instructor:
            {{ course.author_name }}

          </p>

          <div class="d-flex gap-3 mb-3 align-items-center">

            <span>

              👁 {{ course.views }}

            </span>

            <button
              class="btn btn-sm"
              [ngClass]="course.liked ? 'btn-danger' : 'btn-outline-danger'"
              (click)="course.liked ? unlikeCourse(course) : likeCourse(course)">

              ❤️ {{ course.likes }}

            </button>

          </div>

          <button
            class="btn btn-primary mt-auto"
            (click)="goToDetail(course)">

            View Detail

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
