<div class="row g-4">
  <div
    class="col-lg-4 col-md-6"
    *ngFor="let course of courses; trackBy: trackByCourseId"
  >
    <div class="card border-0 shadow-sm h-100">
      <img
        [src]="getImageUrl(course.id)"
        class="card-img-top"
        alt="Course Image"
        height="220"
        style="object-fit: cover"
      />

      <div class="card-body d-flex flex-column">
        <span class="badge bg-primary mb-3">
          {{ course.categoryName }}
        </span>

        <h5 class="fw-bold">
          {{ course.name }}
        </h5>

        <p class="text-muted mb-3">
          {{ course.courseDescription | slice: 0 : 100 }}
        </p>

        <p class="text-muted mb-3">
          Instructor:
          {{ course.authorName }}
        </p>

        <div class="d-flex justify-content-between align-items-center mt-auto">
          <strong
            class="fs-5"
            [ngClass]="
              course.courseType === 'FREE' ? 'text-success' : 'text-warning'
            "
          >
            {{ course.courseType === "FREE" ? "FREE" : "$" + course.price }}
          </strong>
          <button
            class="btn btn-dark btn-sm"
            [routerLink]="['/courses', course.id]"
          >
            Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
