<main class="d-flex w-100">
  <div class="container d-flex flex-column">
    <div class="row vh-100">
      <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
        <div class="d-table-cell align-middle">
          <div class="text-center mt-4">
            <h1 class="h2">Welcome back!</h1>
            <p class="lead">Sign in to your account to continue</p>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="m-sm-3">
                <form [formGroup]="loginForm" (ngSubmit)="signIn()">
                  <!-- <form [formGroup]="loginForm"> -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold"> Email </label>

                    <input
                      class="form-control form-control-lg"
                      id="email"
                      formControlName="email"
                      type="email"
                      autocomplete="email"
                      placeholder="Enter your email"
                      [class.is-invalid]="
                        (email?.touched || submitted) && email?.invalid
                      "
                    />

                    <div *ngIf="(email?.touched || submitted) && email?.errors">
                      <small
                        class="text-danger"
                        *ngIf="email?.errors?.['required']"
                      >
                        Email is required
                      </small>

                      <small
                        class="text-danger"
                        *ngIf="email?.errors?.['email']"
                      >
                        Invalid email format
                      </small>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input
                      class="form-control form-control-lg"
                      id="password"
                      formControlName="password"
                      type="password"
                      placeholder="Enter your password"
                      [class.is-invalid]="
                        (password?.touched || submitted) && password?.invalid
                      "
                    />

                    <div
                      *ngIf="
                        (password?.touched || submitted) && password?.errors
                      "
                    >
                      <small
                        class="text-danger"
                        *ngIf="password?.errors?.['required']"
                      >
                        Password is required
                      </small>
                      <small
                        class="text-danger"
                        *ngIf="password?.errors?.['minlength']"
                      >
                        Password must be at least 8 characters
                      </small>
                    </div>
                    <div *ngIf="loginError" class="text-danger small mt-2">
                      {{ loginError }}
                    </div>
                  </div>
                  <div class="d-grid gap-2 mt-3">
                    <button
                      type="submit"
                      class="btn btn-lg btn-primary"
                      [disabled]="submitted"
                    >
                      <span *ngIf="!submitted"> Sign in </span>

                      <span *ngIf="submitted">
                        <span
                          class="spinner-border spinner-border-sm me-2"
                        ></span>
                        Signing in...
                      </span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-4">
            <a
              routerLink="/forgot-password"
              class="link-primary fw-semibold small"
            >
              Forgot password?
            </a>

            <a
              routerLink="/resend-verification"
              class="link-secondary fw-semibold small"
            >
              Resend verification email
            </a>

            <button
              type="button"
              class="btn btn-outline-primary btn-sm ms-2 px-3 rounded-pill"
              (click)="goSignup()"
            >
              Sign up
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
