<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">Add New User</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="userForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" type="text" formControlName="username" placeholder="Enter username" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" formControlName="email" placeholder="Enter email" />
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" formControlName="password" placeholder="Enter password" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Roles</label>
                <div class="d-flex flex-wrap gap-2">
                  <label formArrayName="roles" *ngFor="let role of roles.controls; let i = index" class="form-check">
                    <input class="form-check-input" type="checkbox" [formControlName]="i" >
                    <span class="form-check-label ms-1">
                      {{roleNames[i]}}
                    </span>
                  </label>
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-secondary" (click)="userForm.reset(); isSubmitted=false;">Reset</button>
              <button type="button" class="btn btn-success" (click)="saveUser()" [disabled]="isSubmitted">
                <i class="bi bi-save"></i> Create
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
