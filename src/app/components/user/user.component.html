<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">Add New User</h4>
        </div>

        <div class="card-body">
          <form [formGroup]="userForm">
            <!-- USERNAME + EMAIL -->
            <div class="row">
              <!-- USERNAME -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold"> Username </label>

                <input
                  class="form-control"
                  type="text"
                  formControlName="username"
                  placeholder="Enter username"
                  [class.is-invalid]="
                    userForm.get('username')?.invalid &&
                    userForm.get('username')?.touched
                  "
                  [class.is-valid]="
                    userForm.get('username')?.valid &&
                    userForm.get('username')?.touched
                  "
                />

                <div
                  class="invalid-feedback"
                  *ngIf="userForm.get('username')?.errors?.['required']"
                >
                  Username is required.
                </div>

                <div
                  class="invalid-feedback"
                  *ngIf="userForm.get('username')?.errors?.['minlength']"
                >
                  Username must be at least 3 characters.
                </div>
              </div>

              <!-- EMAIL -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold"> Email </label>

                <input
                  class="form-control"
                  type="email"
                  formControlName="email"
                  placeholder="Enter email"
                  [class.is-invalid]="
                    userForm.get('email')?.invalid &&
                    userForm.get('email')?.touched
                  "
                  [class.is-valid]="
                    userForm.get('email')?.valid &&
                    userForm.get('email')?.touched
                  "
                />

                <div
                  class="invalid-feedback"
                  *ngIf="userForm.get('email')?.errors?.['required']"
                >
                  Email is required.
                </div>

                <div
                  class="invalid-feedback"
                  *ngIf="userForm.get('email')?.errors?.['email']"
                >
                  Invalid email format.
                </div>
              </div>
            </div>

            <!-- PASSWORD + ROLES -->
            <div class="row">
              <!-- PASSWORD -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold"> Password </label>

                <input
                  class="form-control"
                  type="password"
                  formControlName="password"
                  placeholder="Enter password"
                  [class.is-invalid]="
                    userForm.get('password')?.invalid &&
                    userForm.get('password')?.touched
                  "
                  [class.is-valid]="
                    userForm.get('password')?.valid &&
                    userForm.get('password')?.touched
                  "
                />

                <div
                  class="invalid-feedback"
                  *ngIf="userForm.get('password')?.errors?.['required']"
                >
                  Password is required.
                </div>

                <div
                  class="invalid-feedback"
                  *ngIf="userForm.get('password')?.errors?.['minlength']"
                >
                  Password must be at least 6 characters.
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold"> Roles </label>

                <div
                  formArrayName="roles"
                  class="d-flex flex-wrap gap-3 border rounded p-3"
                >
                  <label
                    *ngFor="let role of roles.controls; let i = index"
                    class="form-check"
                  >
                    <input
                      class="form-check-input"
                      type="checkbox"
                      [formControlName]="i"
                    />

                    <span class="form-check-label ms-1">
                      {{ roleNames[i] }}
                    </span>
                  </label>
                </div>

                <small class="text-muted"> Select at least one role. </small>

                <div
                  class="text-danger small mt-1"
                  *ngIf="
                    userForm.get('roles')?.errors?.['roleRequired'] &&
                    userForm.get('roles')?.touched
                  "
                >
                  Please select at least one role.
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="userForm.reset(); isSubmitted = false"
              >
                Reset
              </button>

              <button
                type="button"
                class="btn btn-success"
                (click)="saveUser()"
                [disabled]="userForm.invalid || isSubmitted"
              >
                <span *ngIf="!isSubmitted">
                  <i class="bi bi-save"></i>
                  Create
                </span>

                <span *ngIf="isSubmitted">
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Saving...
                </span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
