<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-success fs-1"></i>
            <h2 class="fw-bold mt-3">Reset Password</h2>
            <p class="text-muted mb-0">
              Create a new password for your account.
            </p>
          </div>
          <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>

              <input
                type="password"
                class="form-control form-control-lg"
                formControlName="password"
                placeholder="Enter new password"
              />

              <div
                class="text-danger small mt-1"
                *ngIf="
                  resetPasswordForm.get('password')?.touched &&
                  resetPasswordForm.get('password')?.errors?.['required']
                "
              >
                Password is required.
              </div>

              <div
                class="text-danger small mt-1"
                *ngIf="
                  resetPasswordForm.get('password')?.touched &&
                  resetPasswordForm.get('password')?.errors?.['minlength']
                "
              >
                Password must be at least 8 characters.
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Confirm Password</label>

              <input
                type="password"
                class="form-control form-control-lg"
                formControlName="confirmPassword"
                placeholder="Confirm new password"
              />

              <div
                class="text-danger small mt-1"
                *ngIf="
                  resetPasswordForm.get('confirmPassword')?.touched &&
                  resetPasswordForm.get('confirmPassword')?.errors?.['required']
                "
              >
                Confirm password is required.
              </div>

              <div
                class="text-danger small mt-1"
                *ngIf="
                  resetPasswordForm.get('confirmPassword')?.touched &&
                  resetPasswordForm.get('confirmPassword')?.value &&
                  resetPasswordForm.value.password !==
                    resetPasswordForm.value.confirmPassword
                "
              >
                Passwords do not match.
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-success btn-lg w-100"
              [disabled]="loading"
            >
              <span *ngIf="!loading">Reset Password</span>
              <span *ngIf="loading">Processing...</span>
            </button>
          </form>

          <div class="text-center mt-4">
            <a routerLink="/login" class="text-decoration-none">
              Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
