<div
  class="container d-flex justify-content-center align-items-center min-vh-100"
>
  <div
    class="card shadow-lg border-0 text-center p-4"
    style="max-width: 500px; width: 100%"
  >
    <div class="mb-4">
      <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem"></i>
    </div>

    <h2 class="fw-bold text-danger mb-3">Verification Failed</h2>

    <p class="text-muted mb-4">
      The verification link is invalid, expired, or has already been used.
      Please request a new verification email and try again.
    </p>

    <div class="d-grid gap-2">
      <button class="btn btn-primary btn-lg" (click)="goToResendVerification()">
        <i class="bi bi-envelope me-2"></i>
        Resend Verification Email
      </button>

      <button class="btn btn-outline-secondary" routerLink="/login">
        <i class="bi bi-box-arrow-in-right me-2"></i>
        Back to Login
      </button>
    </div>
  </div>
</div>
