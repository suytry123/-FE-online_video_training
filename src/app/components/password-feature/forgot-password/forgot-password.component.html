<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-key-fill text-primary fs-1"></i>
            <h2 class="fw-bold mt-3">Forgot Password</h2>
            <p class="text-muted mb-0">
              Enter your email address and we'll send you a password reset link.
            </p>
          </div>

          <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>

              <input
                type="email"
                class="form-control form-control-lg"
                formControlName="email"
                placeholder="Enter your email"
              />

              <div
                class="text-danger small mt-1"
                *ngIf="
                  forgotPasswordForm.get('email')?.touched &&
                  forgotPasswordForm.get('email')?.errors?.['required']
                "
              >
                Email is required.
              </div>

              <div
                class="text-danger small mt-1"
                *ngIf="
                  forgotPasswordForm.get('email')?.touched &&
                  forgotPasswordForm.get('email')?.errors?.['email']
                "
              >
                Please enter a valid email address.
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-lg w-100"
              [disabled]="loading"
            >
              <span *ngIf="!loading">Send Reset Link</span>
              <span *ngIf="loading">Sending...</span>
            </button>
          </form>

          <div class="alert alert-success mt-4" *ngIf="successMessage">
            {{ successMessage }}
          </div>

          <div class="text-center mt-4">
            <a routerLink="/login" class="text-decoration-none">
              Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
