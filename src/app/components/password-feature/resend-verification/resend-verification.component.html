<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
          <h3 class="text-center mb-3">Resend Verification Email</h3>

          <p class="text-muted text-center mb-4">
            Enter the email address you used during registration.
          </p>

          <form [formGroup]="resendVerificationForm" (ngSubmit)="submit()">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label"> Email Address </label>

              <input
                id="email"
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="Enter your email"
                [ngClass]="{
                  'is-invalid': (submitted || email?.touched) && email?.invalid,
                }"
              />

              <div
                class="invalid-feedback"
                *ngIf="(submitted || email?.touched) && email?.errors"
              >
                <span *ngIf="email?.errors?.['required']">
                  Email is required.
                </span>

                <span *ngIf="email?.errors?.['email']">
                  Please enter a valid email address.
                </span>
              </div>
            </div>

            <!-- Submit -->
            <button
              type="submit"
              class="btn btn-success w-100"
              [disabled]="loading"
            >
              <span *ngIf="!loading"> Send Verification Email </span>

              <span *ngIf="loading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Sending...
              </span>
            </button>
          </form>

          <div class="text-center mt-3">
            <a routerLink="/login" class="text-decoration-none">
              Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
