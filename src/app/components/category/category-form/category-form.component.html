<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Add New Category</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="categoryForm">
            <div class="mb-3">
              <input type="hidden" formControlName="id">
              <label class="form-label">Category Name</label>
              <input class="form-control" type="text" formControlName="name" placeholder="Enter category name" />
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-secondary" (click)="resetForm()" [disabled]="isSubmitted">Reset</button>
              <button type="button" class="btn btn-primary" (click)="saveCategory()" [disabled]="isSubmitted">
                <i class="bi bi-save"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
