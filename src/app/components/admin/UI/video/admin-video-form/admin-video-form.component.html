<div class="container mt-4">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-success text-white">
      <h4>{{ videoId ? "Edit Video" : "Add Video" }}</h4>
    </div>

    <div class="card-body">
      <form [formGroup]="videoForm">
        <input type="hidden" formControlName="id" />
        <input type="hidden" formControlName="course_id" />

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input class="form-control" type="text" formControlName="title" />

          <div
            class="text-danger mt-1"
            *ngIf="
              videoForm.get('title')?.touched && videoForm.get('title')?.invalid
            "
          >
            <small *ngIf="videoForm.get('title')?.errors?.['required']">
              Title is required
            </small>

            <small *ngIf="videoForm.get('title')?.errors?.['minlength']">
              Minimum 3 characters
            </small>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>

          <textarea
            class="form-control"
            rows="4"
            formControlName="description"
          ></textarea>

          <div
            class="text-danger mt-1"
            *ngIf="
              videoForm.get('description')?.touched &&
              videoForm.get('description')?.invalid
            "
          >
            <small *ngIf="videoForm.get('description')?.errors?.['required']">
              Description is required
            </small>

            <small *ngIf="videoForm.get('description')?.errors?.['minlength']">
              Minimum 10 characters
            </small>
          </div>
        </div>

        <div formArrayName="video_link">
          <div
            *ngFor="let link of videoLinks.controls; let i = index"
            class="mb-2"
          >
            <div class="d-flex">
              <input
                class="form-control"
                [formControlName]="i"
                placeholder="Enter video link"
              />
              <button
                type="button"
                class="btn btn-danger ms-2"
                (click)="removeLink(i)"
                [disabled]="videoLinks.length === 1"
              >
                X
              </button>
            </div>

            <div class="text-danger mt-1" *ngIf="link.touched && link.invalid">
              <small *ngIf="link.errors?.['required']">
                Video link is required
              </small>

              <small *ngIf="link.errors?.['pattern']">
                Enter a valid YouTube URL
              </small>
            </div>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="button" class="btn btn-secondary" (click)="addLink()">
            + Add Link
          </button>

          <button
            type="button"
            class="btn btn-outline-dark"
            routerLink="/admin/course/list"
          >
            <i class="bi bi-arrow-left"></i>
            Back
          </button>

          <button type="button" class="btn btn-success" (click)="save()">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
