<div class="container mt-4">
  <h3 class="fw-bold mb-4">Reports Dashboard</h3>
  <!-- SUMMARY CARDS -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card shadow border-0">
        <div class="card-body">
          <h6 class="text-muted">Total Users</h6>

          <h2 class="fw-bold">
            {{ dashboardData?.summary?.total_users }}
          </h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow border-0">
        <div class="card-body">
          <h6 class="text-muted">Users In Range</h6>

          <h2 class="fw-bold">
            {{ dashboardData?.summary?.users_in_range }}
          </h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow border-0">
        <div class="card-body">
          <h6 class="text-muted">Total Videos</h6>

          <h2 class="fw-bold">
            {{ dashboardData?.summary?.total_videos }}
          </h2>
        </div>
      </div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="row mb-4">
    <!-- LINE CHART -->
    <div class="col-lg-8">
      <div class="card shadow border-0 h-100">
        <div class="card-header bg-dark text-white">User Trend</div>

        <div class="card-body">
          <canvas baseChart [data]="lineChartData" [type]="'line'"> </canvas>
        </div>
      </div>
    </div>

    <!-- PIE CHART -->
    <div class="col-lg-4">
      <div class="card shadow border-0 h-100">
        <div class="card-header bg-primary text-white">Role Breakdown</div>

        <div class="card-body">
          <canvas baseChart [data]="pieChartData" [type]="'pie'"> </canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- USER REPORTS -->
  <div class="card shadow border-0 mb-4">
    <div class="card-header bg-dark text-white">User Reports</div>

    <div class="card-body d-flex flex-wrap gap-2">
      <button class="btn btn-primary" (click)="daily()">Daily</button>
      <button class="btn btn-success" (click)="weekly()">Weekly</button>
      <button class="btn btn-warning" (click)="monthly()">Monthly</button>
      <button class="btn btn-danger" (click)="yearly()">Yearly</button>
    </div>
  </div>

  <!-- CUSTOM REPORT -->
  <div class="card shadow border-0 mb-4">
    <div class="card-header bg-secondary text-white">Custom Date Report</div>

    <div class="card-body d-flex gap-2 align-items-center flex-wrap">
      <input
        type="datetime-local"
        [(ngModel)]="startDate"
        class="form-control"
        style="max-width: 220px"
      />
      <input
        type="datetime-local"
        [(ngModel)]="endDate"
        class="form-control"
        style="max-width: 220px"
      />

      <button class="btn btn-dark" (click)="between()">Download</button>
    </div>
  </div>

  <!-- VIDEO REPORT -->
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white">Video Report</div>

    <div class="card-body">
      <button class="btn btn-outline-primary" (click)="video()">
        Download Video Report
      </button>
    </div>
  </div>
</div>
