<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">
            {{ categoryId ? "Update Category" : "Add New Category" }}
          </h4>
        </div>
        <div class="card-body">
          <form [formGroup]="categoryForm">
            <div class="mb-3">
              <input type="hidden" formControlName="id" />
              <label class="form-label">Category Name</label>
              <input
                class="form-control"
                type="text"
                formControlName="name"
                placeholder="Enter category name"
                [class.is-invalid]="
                  categoryForm.get('name')?.invalid &&
                  categoryForm.get('name')?.touched
                "
                [class.is-valid]="
                  categoryForm.get('name')?.valid &&
                  categoryForm.get('name')?.touched
                "
              />
              <div
                *ngIf="
                  categoryForm.get('name')?.touched &&
                  categoryForm.get('name')?.invalid
                "
                class="text-danger mt-1"
              >
                <small *ngIf="categoryForm.get('name')?.errors?.['required']">
                  Category name is required
                </small>

                <small *ngIf="categoryForm.get('name')?.errors?.['minlength']">
                  Minimum 3 characters required
                </small>

                <small *ngIf="categoryForm.get('name')?.errors?.['maxlength']">
                  Maximum 50 characters allowed
                </small>
              </div>
            </div>
            <!-- <div class="d-flex justify-content-end gap-2 mt-4"> -->
            <div class="d-flex justify-content-between align-items-center mt-4">
              <!-- LEFT -->
              <button
                type="button"
                class="btn btn-outline-dark"
                routerLink="/admin/category/list"
                [disabled]="isSubmitted"
              >
                <i class="bi bi-arrow-left"></i>
                Back
              </button>

              <!-- RIGHT -->
              <div class="d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="resetForm()"
                  [disabled]="isSubmitted"
                >
                  Reset
                </button>

                <button
                  type="button"
                  class="btn btn-primary"
                  (click)="saveCategory()"
                  [disabled]="isSubmitted"
                >
                  <span *ngIf="!isSubmitted">
                    <i class="bi bi-save"></i>
                    {{ categoryId ? "Update" : "Save" }}
                  </span>

                  <span *ngIf="isSubmitted">
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    Saving...
                  </span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
