<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3 text-center">Sign Up</h3>
          <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" class="form-control" formControlName="username" placeholder="Enter username" [ngClass]="{'is-invalid': submitted && signupForm.controls['username'].invalid}" />
              <div *ngIf="submitted && signupForm.controls['username'].errors" class="invalid-feedback">
                <span *ngIf="signupForm.controls['username'].errors['required']">Username is required.</span>
                <span *ngIf="signupForm.controls['username'].errors['minlength']">Username must be at least 3 characters.</span>
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email" [ngClass]="{'is-invalid': submitted && signupForm.controls['email'].invalid}" />
              <div *ngIf="submitted && signupForm.controls['email'].errors" class="invalid-feedback">
                <span *ngIf="signupForm.controls['email'].errors['required']">Email is required.</span>
                <span *ngIf="signupForm.controls['email'].errors['email']">Enter a valid email address.</span>
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter password" [ngClass]="{'is-invalid': submitted && signupForm.controls['password'].invalid}" />
              <div *ngIf="submitted && signupForm.controls['password'].errors" class="invalid-feedback">
                <span *ngIf="signupForm.controls['password'].errors['required']">Password is required.</span>
                <span *ngIf="signupForm.controls['password'].errors['minlength']">Password must be at least 6 characters.</span>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>
          <div *ngIf="successMsg" class="alert alert-success mt-3">{{ successMsg }}</div>
          <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
