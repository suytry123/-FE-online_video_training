<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3 text-center">Sign Up</h3>
          <div class="mb-3">
            <button
              type="button"
              class="btn btn-outline-secondary w-100"
              (click)="goToLogin()"
              aria-label="Go back to login page"
            >
              <i class="fas fa-arrow-left me-2"></i>Back to Login
            </button>
          </div>
          <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                id="username"
                class="form-control"
                formControlName="username"
                placeholder="Enter username"
                [ngClass]="{
                  'is-invalid':
                    (submitted || f['username'].touched) &&
                    f['username'].invalid,
                }"
              />

              <div
                *ngIf="
                  (submitted || f['username'].touched) && f['username'].errors
                "
                class="invalid-feedback"
              >
                <span *ngIf="f['username'].errors['required']"
                  >Username is required.</span
                >
                <span *ngIf="f['username'].errors['minlength']"
                  >Username must be at least 3 characters.</span
                >
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input
                type="email"
                id="email"
                class="form-control"
                formControlName="email"
                placeholder="Enter your email"
                [ngClass]="{
                  'is-invalid':
                    (submitted || f['email'].touched) && f['email'].invalid,
                }"
              />

              <div
                *ngIf="(submitted || f['email'].touched) && f['email'].errors"
                class="invalid-feedback"
              >
                <span *ngIf="f['email'].errors['required']"
                  >Email is required.</span
                >
                <span *ngIf="f['email'].errors['email']"
                  >Enter a valid email address.</span
                >
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                class="form-control"
                formControlName="password"
                placeholder="Enter password"
                [ngClass]="{
                  'is-invalid':
                    (submitted || f['password'].touched) &&
                    f['password'].invalid,
                }"
              />

              <div
                *ngIf="
                  (submitted || f['password'].touched) && f['password'].errors
                "
                class="invalid-feedback"
              >
                <span *ngIf="f['password'].errors['required']"
                  >Password is required.</span
                >
                <span *ngIf="f['password'].errors['minlength']"
                  >Password must be at least 8 characters.</span
                >
              </div>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">
                Confirm Password
              </label>

              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                formControlName="confirmPassword"
                placeholder="Confirm password"
                [ngClass]="{
                  'is-invalid':
                    (submitted || f['confirmPassword'].touched) &&
                    (f['confirmPassword'].invalid ||
                      signupForm.hasError('passwordMismatch')),
                }"
              />

              <div
                *ngIf="
                  (submitted || f['confirmPassword'].touched) &&
                  f['confirmPassword'].errors
                "
                class="invalid-feedback"
              >
                <span *ngIf="f['confirmPassword'].errors['required']">
                  Confirm password is required.
                </span>
              </div>

              <div
                *ngIf="
                  (submitted || f['confirmPassword'].touched) &&
                  signupForm.hasError('passwordMismatch')
                "
                class="invalid-feedback d-block"
              >
                Passwords do not match.
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>
          <div *ngIf="successMsg" class="alert alert-success mt-3">
            {{ successMsg }}
          </div>
          <div *ngIf="errorMsg" class="alert alert-danger mt-3">
            {{ errorMsg }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
