<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Add New Course</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="courseForm">
            <div class="mb-3">
              <!-- <input type="hidden" formControlName="id"> -->
              <label class="form-label">Category ID</label>
              <input
                class="form-control"
                type="number"
                formControlName="categoryId" placeholder="Enter category ID"
              />

              <div
                *ngIf="
                  courseForm.get('categoryId')?.touched &&
                  courseForm.get('categoryId')?.invalid
                "
                class="text-danger"
              >
                <small *ngIf="courseForm.get('categoryId')?.errors?.['required']">
                  Category ID is required
                </small>
                <small *ngIf="courseForm.get('categoryId')?.errors?.['min']">
                  Category ID must be greater than 0
                </small>
              </div>
              <label class="form-label">Course Name</label>
              <input class="form-control" type="text" formControlName="name" placeholder="Enter course name" />

              <div
                *ngIf="
                  courseForm.get('name')?.touched &&
                  courseForm.get('name')?.invalid
                "
                class="text-danger"
              >
                <small *ngIf="courseForm.get('name')?.errors?.['required']">
                  Course name is required
                </small>
                <small *ngIf="courseForm.get('name')?.errors?.['minlength']">
                  Minimum 3 characters required
                </small>
              </div>
              <label class="form-label">Author ID</label>
              <input
                class="form-control"
                type="number"
                formControlName="authorId"
                placeholder="Enter author ID"
              />

              <div
                *ngIf="
                  courseForm.get('authorId')?.touched &&
                  courseForm.get('authorId')?.invalid
                "
                class="text-danger"
              >
                <small *ngIf="courseForm.get('authorId')?.errors?.['required']">
                  Author ID is required
                </small>
              </div>
              <label class="form-label">Price</label>
              <input
                class="form-control"
                type="number"
                formControlName="price"
                placeholder="Enter price"
              />

              <div
                *ngIf="
                  courseForm.get('price')?.touched &&
                  courseForm.get('price')?.invalid
                "
                class="text-danger"
              >
                <small *ngIf="courseForm.get('price')?.errors?.['required']">
                  Price is required
                </small>
                <small *ngIf="courseForm.get('price')?.errors?.['min']">
                  Price must be >= 0
                </small>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="resetForm()"
                [disabled]="isSubmitted"
              >
                Reset
              </button>
              <button
                type="button"
                class="btn btn-primary"
                (click)="saveCourse()"
                [disabled]="isSubmitted"
              >
                <i class="bi bi-save"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
