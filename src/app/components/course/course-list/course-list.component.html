<div class="container-fluid mt-4">
  <div class="row mb-3">
    <div class="col-12 d-flex justify-content-between align-items-center">
      <h2 class="fw-bold text-primary mb-0">Courses</h2>
      <button class="btn btn-success shadow-sm px-4 py-2" (click)="goToCourseForm()">
        <i class="bi bi-plus-circle me-2"></i> New Course
      </button>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-gradient bg-primary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Course List</h5>
          <div class="d-flex align-items-center">
            <label class="me-2 mb-0">Show</label>
            <select (change)="getCoursesByLimit($event)" class="form-select form-select-sm w-auto shadow-none">
              <option [value]="5" selected>5</option>
              <option [value]="10">10</option>
              <option [value]="15">15</option>
            </select>
            <span class="ms-2">entries</span>
          </div>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover table-striped mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th class="text-center">#</th>
                <th>CourseName</th>
                <th>Price</th>
                <th>CategoryName</th>
                <th>AuthorName</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let course of courses; let i = index">
                <td class="text-center">{{ i + 1 }}</td>
                <td>{{course.name}}</td>
                <td>{{course.price}}</td>
                <td>{{course.category_name}}</td>
                <td>{{course.author_name}}</td>
                <td class="text-center">
                  <button class="btn btn-outline-primary btn-sm me-2 shadow-sm" (click)="edit(course.id)">
                    <i class="bi bi-pencil"></i> Edit
                  </button>
                  <button class="btn btn-outline-danger btn-sm shadow-sm" (click)="delete(course.id)">
                    <i class="bi bi-trash"></i> Delete
                  </button>
                  <button class="btn btn-primary btn-sm shadow-sm" (click)="goToVideos(course.id)">
                    <i class="bi bi-eye"></i> View Videos
                  </button>
                </td>
              </tr>
              <tr *ngIf="!courses || courses.length === 0">
                <td colspan="5" class="text-center text-muted py-4">No courses found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
