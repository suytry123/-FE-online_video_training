<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header">
      <h4>My Profile</h4>
    </div>

    <div class="card-body" *ngIf="profile">
      <div class="text-center mb-4">
        <img
          [src]="profileImage"
          (error)="profileImage = 'assets/img/avatars/default.jpg'"
          class="profile-avatar rounded-circle border shadow-sm"
          width="120"
          height="120"
          alt="Profile"
        />
      </div>

      <div class="mb-4">
        <label class="form-label">Upload Photo</label>

        <input
          type="file"
          class="form-control"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Username</label>

        <input class="form-control" [value]="profile.username" readonly />
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>

        <input class="form-control" [value]="profile.email" readonly />
      </div>

      <form [formGroup]="profileForm">
        <div class="mb-3">
          <label class="form-label">Phone Number</label>

          <input
            formControlName="phoneNumber"
            class="form-control"
            placeholder="Enter phone number"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Gender</label>

          <select formControlName="gender" class="form-select">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <button type="button" class="btn btn-success" (click)="updateProfile()">
          Update Profile
        </button>
      </form>
    </div>
  </div>
</div>
